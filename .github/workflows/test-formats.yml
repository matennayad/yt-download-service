name: Test Formats Endpoint

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'קישור YouTube לבדיקה'
        required: true
        default: 'https://www.youtube.com/watch?v=eaqW5eQXTdM'

      player_client:
        description: 'שמות client מופרדים בפסיק, למשל: ios,web'
        required: true
        default: 'android'

      use_cookies:
        description: 'להשתמש בעוגיות? true/false'
        required: true
        default: 'true'

      use_proxy:
        description: 'להשתמש ב-Tor? true/false'
        required: true
        default: 'false'

      target:
        description: 'איזה שרת לבדוק?'
        required: true
        default: 'render'
        type: choice
        options:
          - render
          - railway

jobs:
  test-formats:
    runs-on: ubuntu-latest

    steps:
      - name: Build payload file
        run: |
          python3 -c "
          import json

          clients = '${{ github.event.inputs.player_client }}'.split(',')

          payload = {
              'url': '${{ github.event.inputs.youtube_url }}',
              'player_client': clients,
              'use_cookies': '${{ github.event.inputs.use_cookies }}'.strip().lower() == 'true',
              'use_proxy': '${{ github.event.inputs.use_proxy }}'.strip().lower() == 'true',
          }

          with open('payload.json', 'w') as f:
              json.dump(payload, f)
          "

          echo "===== PAYLOAD ====="
          cat payload.json
          echo "==================="

      - name: Call /formats endpoint
        run: |
          if [ "${{ github.event.inputs.target }}" = "railway" ]; then
            BASE_URL="https://yt-download-service-production.up.railway.app"
          else
            BASE_URL="https://yt-download-service-vf4l.onrender.com"
          fi

          echo "Testing: $BASE_URL"

          curl -X POST \
            "$BASE_URL/formats" \
            -H "Content-Type: application/json" \
            -H "X-API-KEY: ${{ secrets.API_KEY }}" \
            --data-binary @payload.json \
            -w "\n\nHTTP Status: %{http_code}\n" \
            --max-time 120
